version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:1.25-alpine
    container_name: sipdok-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - sipdok

  # PHP-FPM
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: sipdok-php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
      - redis
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sipdok
      - DB_USERNAME=sipdok
      - DB_PASSWORD=sipdok_secret
      - REDIS_HOST=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    networks:
      - sipdok

  # Queue Worker
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: sipdok-queue
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - php
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=sipdok
      - DB_USERNAME=sipdok
      - DB_PASSWORD=sipdok_secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    networks:
      - sipdok
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: sipdok-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: sipdok
      POSTGRES_USER: sipdok
      POSTGRES_PASSWORD: sipdok_secret
    volumes:
      - sipdok_postgres_data:/var/lib/postgresql/data
    networks:
      - sipdok

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sipdok-redis
    ports:
      - "6380:6379"
    volumes:
      - sipdok_redis_data:/data
    networks:
      - sipdok

  # Node (Frontend Build)
  node:
    image: node:20-alpine
    container_name: sipdok-node
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build"
    profiles:
      - build

volumes:
  sipdok_postgres_data:
  sipdok_redis_data:

networks:
  sipdok:
    driver: bridge
