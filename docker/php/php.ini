; ==========================================================
; SIPDOK — PHP runtime tuning
; ==========================================================
; The application source is bind-mounted from the host
; (./backend -> /var/www/html). On Docker Desktop (Windows/macOS)
; every file stat across that mount costs ~2ms versus ~0.0002ms on
; the container filesystem. Laravel touches thousands of files per
; request, so with OPcache re-validating timestamps each time the
; baseline latency was ~5s per request — including trivial routes.
;
; Caching the compiled opcodes without re-stat'ing every file brings
; that back down to double-digit milliseconds.
;
; NOTE: with validate_timestamps=0, edits to PHP files are not picked
; up until OPcache is reset. Run `make restart-php` (or
; `docker compose restart php queue`) after changing PHP code.
; Set PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 below while actively developing
; if you prefer auto-reload over raw speed.
; ==========================================================

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
; Laravel + vendor comfortably exceeds the 10k default.
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; Laravel relies on doc comments for reflection-based features.
opcache.save_comments = 1

[performance]
; Keeps resolved paths cached so include/require stops re-walking the mount.
realpath_cache_size = 8192K
realpath_cache_ttl = 600

[uploads]
; Aligns with the 10 MB per-document limit enforced in UploadDocumentRequest.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 512M
